openapi: 3.0.3
info:
  title: Users API - Regression Fixture
  version: 1.0.0
  description: >
    Minimal fixture spec used by tests/test_contract_grounded_generation.py.
    No security schemes, no minimum/maximum constraints, and no error response
    body schemas are defined anywhere in this document - on purpose, so tests
    can assert that nothing is invented for those cases.
servers:
  - url: https://users.example.com/v1
components:
  schemas:
    User:
      type: object
      required: [id, name, email, age]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        age:
          type: integer
        status:
          type: string
    CreateUserRequest:
      type: object
      required: [name, email, age]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        age:
          type: integer
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        age:
          type: integer
        status:
          type: string
paths:
  /users:
    get:
      operationId: getUsers
      summary: List users
      tags: [users]
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "500":
          description: Internal server error
    post:
      operationId: createUser
      summary: Create a user
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
        "409":
          description: Conflict - user already exists
  /users/{userId}:
    get:
      operationId: getUserById
      summary: Get a user by id
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The requested user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
        "500":
          description: Internal server error
    put:
      operationId: updateUser
      summary: Update a user
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
        "404":
          description: User not found
    delete:
      operationId: deleteUser
      summary: Delete a user
      tags: [users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User deleted
        "404":
          description: User not found
        "500":
          description: Internal server error
