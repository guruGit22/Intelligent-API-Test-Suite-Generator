openapi: 3.0.3
info:
  title: Petstore Demo API
  version: 1.0.0
  description: >
    Demo API contract for the local Petstore mock server (mock_petstore_server.py)
    bundled with the Intelligent API Test Suite Generator. Upload this file into
    the Test Case Generator page to produce test cases and a Postman collection
    that can be executed against the mock server for live verification.
servers:
  - url: http://127.0.0.1:5056
    description: Local mock Petstore server (run `python mock_petstore_server.py`)
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Fido
        tag:
          type: string
          example: dog
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Rex
        tag:
          type: string
          example: dog
    Error:
      type: object
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: pet not found
security:
  - BearerAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      description: Returns pets currently held by the mock server, optionally limited.
      tags: [pets]
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            example: 20
          description: Maximum number of pets to return. Negative or non-numeric values return 400.
      responses:
        "200":
          description: A paged array of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
              examples:
                default:
                  summary: Illustrative example (matches mock server seed data)
                  value:
                    - id: 1
                      name: Fido
                      tag: dog
                    - id: 2
                      name: Whiskers
                      tag: cat
        "400":
          description: Invalid limit value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  summary: Illustrative example
                  value:
                    code: 400
                    message: invalid limit
    post:
      operationId: createPet
      summary: Create a pet
      description: Creates a new pet. Requires a bearer token; the mock server rejects missing/expired tokens with 401.
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
            examples:
              default:
                summary: Illustrative example
                value:
                  name: Rex
                  tag: dog
      responses:
        "201":
          description: Pet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
              examples:
                default:
                  summary: Illustrative example
                  value:
                    id: 3
                    name: Rex
                    tag: dog
        "400":
          description: Missing required "name" field or invalid JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  summary: Illustrative example
                  value:
                    code: 400
                    message: name is required
        "401":
          description: Missing or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  summary: Illustrative example
                  value:
                    code: 401
                    message: unauthorized
  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get a pet by ID
      tags: [pets]
      security: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: The requested pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
              examples:
                default:
                  summary: Illustrative example (matches mock server seed data)
                  value:
                    id: 1
                    name: Fido
                    tag: dog
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  summary: Illustrative example
                  value:
                    code: 404
                    message: pet not found
    delete:
      operationId: deletePet
      summary: Delete a pet
      description: Deletes a pet by ID. Requires a bearer token; the mock server rejects missing/expired tokens with 401.
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
          example: 2
      responses:
        "204":
          description: Pet deleted
        "401":
          description: Missing or expired bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  summary: Illustrative example
                  value:
                    code: 401
                    message: unauthorized
        "404":
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                default:
                  summary: Illustrative example
                  value:
                    code: 404
                    message: pet not found
